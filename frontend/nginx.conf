server{
    listen 80;
    server_name _;

    location =/health {
        proxy_pass http://backend:3000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /{
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}